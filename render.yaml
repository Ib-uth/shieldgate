services:
  # ShieldGate API Gateway Web Service
  - type: web
    name: shieldgate-gateway
    env: docker
    dockerfilePath: ./Dockerfile.gateway
    plan: starter
    region: oregon
    healthCheckPath: /health
    numInstances: 1
    envVars:
      # Database Configuration (Neon PostgreSQL)
      - key: DATABASE_URL
        sync: false
        value: "postgresql://neondb_owner:npg_xZJWpwh2bOA6@ep-frosty-boat-a4bscze7-pooler.us-east-1.aws.neon.tech/neondb?sslmode=require&channel_binding=require"
      
      # Services Configuration
      - key: DOWNSTREAM_URL
        sync: false
        value: "https://your-mock-service.onrender.com"
      
      - key: REDIS_URL
        sync: false
        value: "${redis://shieldgate-redis}"
      
      # JWT Configuration
      - key: JWT_PRIVATE_KEY_PATH
        sync: false
        value: "/app/keys/private.pem"
      
      - key: JWT_PUBLIC_KEY_PATH
        sync: false
        value: "/app/keys/public.pem"
      
      # Rate Limiting Configuration
      - key: RATE_LIMIT_IP_REQUESTS
        sync: false
        value: "60"
      
      - key: RATE_LIMIT_IP_WINDOW
        sync: false
        value: "60"
      
      - key: RATE_LIMIT_USER_REQUESTS
        sync: false
        value: "300"
      
      - key: RATE_LIMIT_USER_WINDOW
        sync: false
        value: "60"
      
      # Threat Detection Configuration
      - key: THREAT_SCORE_FLAG_THRESHOLD
        sync: false
        value: "0.7"
      
      - key: THREAT_SCORE_BLOCK_THRESHOLD
        sync: false
        value: "0.9"
      
      - key: THREAT_MODEL_PATH
        sync: false
        value: "/app/models/threat_model.joblib"
      
      # Gateway Configuration
      - key: GATEWAY_HOST
        sync: false
        value: "0.0.0.0"
      
      - key: GATEWAY_PORT
        sync: false
        value: "8000"
      
      # CORS: browser Origin is the *admin UI* host, not this API URL.
      - key: ALLOWED_ORIGINS
        sync: false
        value: "https://shieldgate.onrender.com,http://localhost:5173,http://localhost:3000"
      
      # Logging Configuration
      - key: LOG_LEVEL
        sync: false
        value: "INFO"
    
    # Auto-scaling configuration
    autoDeploy: true
    buildCommand: "echo 'Build handled by Dockerfile'"
    startCommand: "python -m uvicorn apps.gateway.main:app --host 0.0.0.0 --port 8000"

  # Redis Instance for Rate Limiting and Caching
  - type: redis
    name: shieldgate-redis
    plan: starter
    region: oregon
    ipAllowList: []  # Restrict to internal services only
    
    # Redis Configuration
    envVars:
      - key: REDIS_MAXMEMORY_POLICY
        sync: false
        value: "allkeys-lru"  # Least Recently Used eviction policy

databases: []
# Note: Using external Neon PostgreSQL database instead of Render's managed database
