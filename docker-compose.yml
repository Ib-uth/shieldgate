version: '3.8'

services:
  # PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    container_name: shieldgate-postgres
    environment:
      POSTGRES_DB: shieldgate
      POSTGRES_USER: shieldgate
      POSTGRES_PASSWORD: shieldgate123
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./scripts/init-db.sql:/docker-entrypoint-initdb.d/init-db.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U shieldgate -d shieldgate"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - shieldgate-network

  # Redis
  redis:
    image: redis:7-alpine
    container_name: shieldgate-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - shieldgate-network

  # Mock Downstream Service
  mock-service:
    build:
      context: .
      dockerfile: Dockerfile.mock
    container_name: shieldgate-mock
    ports:
      - "8001:8001"
    environment:
      - MOCK_SERVICE_PORT=8001
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8001/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - shieldgate-network

  # ShieldGate API Gateway
  gateway:
    build:
      context: .
      dockerfile: Dockerfile.gateway
    container_name: shieldgate-gateway
    ports:
      - "8000:8000"
    environment:
      # Database (override with Neon or other URL via .env)
      - DATABASE_URL=${DATABASE_URL:-postgresql://shieldgate:shieldgate123@postgres:5432/shieldgate}

      # Services
      - DOWNSTREAM_URL=http://mock-service:8001
      - DOWNSTREAM_API_PREFIX=api/v1
      - REDIS_URL=redis://redis:6379
      
      # JWT
      - JWT_PRIVATE_KEY_PATH=/app/keys/private.pem
      - JWT_PUBLIC_KEY_PATH=/app/keys/public.pem
      
      # Logging & ML
      - LOG_LEVEL=INFO
      - THREAT_MODEL_PATH=/app/models/threat_model.joblib
      
      # Rate Limiting
      - RATE_LIMIT_IP_REQUESTS=60
      - RATE_LIMIT_IP_WINDOW=60
      - RATE_LIMIT_USER_REQUESTS=300
      - RATE_LIMIT_USER_WINDOW=60
      
      # Threat Detection
      - THREAT_SCORE_FLAG_THRESHOLD=0.7
      - THREAT_SCORE_BLOCK_THRESHOLD=0.9
      
      # Gateway Settings
      - GATEWAY_HOST=0.0.0.0
      - GATEWAY_PORT=8000
      
      # CORS
      - ALLOWED_ORIGINS=http://localhost:3000
      
      # Admin UI
      - ADMIN_UI_URL=http://localhost:3000
    
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      mock-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - shieldgate-network
    volumes:
      - ./keys:/app/keys:ro
      - ./models:/app/models:ro

  # Admin UI (Development)
  admin-ui:
    build:
      context: ./apps/admin-ui
      dockerfile: Dockerfile
    container_name: shieldgate-admin-ui
    ports:
      - "3000:3000"
    environment:
      - VITE_API_URL=http://localhost:8000
    depends_on:
      gateway:
        condition: service_healthy
    networks:
      - shieldgate-network
    volumes:
      - ./apps/admin-ui/src:/app/src
      - ./apps/admin-ui/public:/app/public
    command: npm run dev

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local

networks:
  shieldgate-network:
    driver: bridge
